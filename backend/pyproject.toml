[project]
name = "collexa-backend"
version = "1.0.0"
description = "COLLEXA: Intelligent Chat Agent for Kathmandu Engineering College"
requires-python = ">=3.11"

dependencies = [
    # FastAPI & Web
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "email-validator>=2.0.0,<3.0.0",

    # Authentication & Security
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.6",

    # Database
    "sqlalchemy==2.0.23",
    "psycopg[binary]==3.1.18",
    "alembic==1.12.1",
    "pgvector==0.2.4",

    # RAG & LLM
    "langchain>=0.1.0,<0.2.0",
    "langchain-community>=0.0.10,<0.2.0",
    "langchain-core>=0.1.7,<0.2.0",
    "langgraph>=0.0.34,<0.1.0",
    "langsmith>=0.0.87,<0.2.0",
    "chromadb>=0.4.17",
    "google-generativeai>=0.3.0",
    "langchain-google-genai>=0.0.6,<1.0.0",

    # Vector embeddings
    "sentence-transformers>=2.2.2",
    "numpy>=1.24.3",

    # API clients
    "httpx==0.25.1",
    "aiohttp==3.9.1",

    # Environment & Config
    "python-dotenv==1.0.0",

    # Logging & Monitoring
    "structlog==23.2.0",
    "python-json-logger==2.0.7",

]

[project.optional-dependencies]
dev = [
    "black==23.11.0",
    "ruff==0.1.7",
    "mypy==1.7.0",
    "pytest-cov==4.1.0",
    "ipython==8.17.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
